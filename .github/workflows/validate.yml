name: Validate Terraform

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: Format and validate
        uses: ./.github/actions/terraform-validate

  plan:
    name: Plan infrastructure
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: Configure AWS credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Initialize remote backend
        uses: ./.github/actions/terraform-init-backend
        with:
          state-bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Create plan
        uses: ./.github/actions/terraform-plan
