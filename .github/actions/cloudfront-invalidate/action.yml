name: Invalidate CloudFront
description: Wait for the CloudFront distribution deployment and invalidate cached paths.

runs:
  using: composite
  steps:
    - name: Wait for CloudFront deployment
      shell: bash
      run: |
        DISTRIBUTION_ID=$(terraform -chdir=terraform output -raw cloudfront_distribution_id)
        aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"

    - name: Invalidate CloudFront cache
      shell: bash
      run: |
        DISTRIBUTION_ID=$(terraform -chdir=terraform output -raw cloudfront_distribution_id)
        aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
