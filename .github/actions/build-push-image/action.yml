name: Build and push Magnolia image
description: Build the Magnolia container and push it to the Terraform-managed ECR repository.

inputs:
  image-tag:
    description: Image tag to publish.
    required: true
  aws-region:
    description: AWS region containing the ECR repository.
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate Docker to ECR
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        ECR_REPOSITORY_URL=$(terraform -chdir=terraform output -raw ecr_repository_url)
        ECR_REGISTRY=${ECR_REPOSITORY_URL%%/*}
        aws ecr get-login-password --region "$AWS_REGION" |
          docker login --username AWS --password-stdin "$ECR_REGISTRY"

    - name: Build and push image
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        ECR_REPOSITORY_URL=$(terraform -chdir=terraform output -raw ecr_repository_url)
        docker build --tag "$ECR_REPOSITORY_URL:$IMAGE_TAG" docker
        docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
